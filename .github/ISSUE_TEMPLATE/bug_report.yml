name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in StepDSA visualizer or engine"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant information as possible so we can reproduce and fix it quickly.
  - type: dropdown
    id: affected-module
    attributes:
      label: Affected Algorithm / Component
      description: Which algorithm or subsystem encountered the issue?
      options:
        - "Quicksort (Lomuto / Hoare)"
        - "Mergesort (Divide & Conquer)"
        - "Binary Search (Invariant Boundary)"
        - "Binary Search Tree (BST Insertion / Traversal)"
        - "Two Pointers (Container With Most Water)"
        - "Sliding Window (Max Sum Subarray)"
        - "Playback Engine & Timeline Stepper"
        - "Code Inspector (C++ / Python / TS / Java)"
        - "Web Audio Sonification Engine"
        - "Playground & Custom Input"
        - "Personal Code Studio / CLI"
        - "Other / UI Glitch"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., When stepping backwards in Quicksort after a partition step, the pivot color does not reset to active."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Exactly how to trigger the issue from a fresh page load.
      placeholder: |
        1. Open StepDSA visualizer.
        2. Select 'Quicksort'.
        3. Input custom array: [10, 5, 2, 8, 7].
        4. Click 'Step Forward' 4 times until the first swap.
        5. Click 'Step Backward'.
        6. Observe the visual glitch...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: "The array bar should return to its previous height and neutral color state."
    validations:
      required: true
  - type: input
    id: custom-data
    attributes:
      label: Custom Input Data (if applicable)
      description: The exact array or parameters used when reproducing the issue.
      placeholder: "[9, 3, 7, 1, 8, 2, 5]"
  - type: checkboxes
    id: environment
    attributes:
      label: Environment & Browser
      description: Check all platforms where you observed this issue.
      options:
        - label: "Google Chrome / Chromium / Brave"
        - label: "Mozilla Firefox"
        - label: "Apple Safari"
        - label: "Microsoft Edge"
        - label: "Mobile Browser (iOS / Android)"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Console Logs
      description: Paste any screenshots or browser console error logs here if available.
