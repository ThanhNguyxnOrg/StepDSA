name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Name the artifact for this run attempt
        id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          for delay in 0 1 2 4 8 16 32; do
            sleep "$delay"
            if visible=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ "$visible" == "$ARTIFACT_ID" ]]; then
              exit 0
            fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
