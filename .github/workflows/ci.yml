name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@487331d8d32ef5847ac1e53935681669cf56e331
    with:
      job_name: test
      node_version: "22"
      package_manager: npm
      cache: npm
      typecheck_command: npx tsc --noEmit
      test_command: npm test
      build_command: npm run build
