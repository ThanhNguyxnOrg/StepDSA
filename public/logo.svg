<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" fill="none">
  <defs>
    <linearGradient id="logoBar1Grad" x1="0" y1="42" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoBar2Grad" x1="0" y1="26" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="logoChevGrad" x1="42" y1="14" x2="78" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="logoNodeGrad" x1="38" y1="4" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Tight Bounds: 4 4 to 82 80) -->
  <g id="brand-emblem">
    <!-- Bar 1 (Short) -->
    <rect x="4" y="44" width="13" height="36" rx="4" fill="url(#logoBar1Grad)" />
    <!-- Bar 2 (Medium) -->
    <rect x="22" y="26" width="13" height="54" rx="4" fill="url(#logoBar2Grad)" />
    <!-- Forward Stepper Chevron -->
    <path
      d="M 42 16 L 64 45 L 42 74"
      stroke="url(#logoChevGrad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Floating Tree / Graph Nodes -->
    <path
      d="M 40 18 L 58 13 L 78 5"
      stroke="url(#logoNodeGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <circle cx="40" cy="18" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="58" cy="13" r="5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="78" cy="5" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Typography: StepDSA + TIME-TRAVEL ENGINE -->
  <g transform="translate(94, 0)">
    <text x="0" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#F8FAFC" letter-spacing="-1">
      Step<tspan fill="#10B981">DSA</tspan>
    </text>
    <text x="2" y="70" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="3.2">
      TIME-TRAVEL ENGINE
    </text>
  </g>
</svg>
