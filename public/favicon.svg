<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="stepGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stepped Algorithm Bars (Ascending Sorted Order) -->
  <rect x="8" y="34" width="12" height="22" rx="3.5" fill="url(#barGrad1)" />
  <rect x="26" y="22" width="12" height="34" rx="3.5" fill="url(#barGrad2)" />
  <rect x="44" y="10" width="12" height="46" rx="3.5" fill="url(#barGrad3)" />

  <!-- Time-Travel Trajectory Path -->
  <path d="M14 34 C 20 20, 32 18, 50 10" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Graph Nodes on Top of Bars -->
  <circle cx="14" cy="34" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="32" cy="22" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="50" cy="10" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />

  <!-- Dynamic Step Pulse / Time Arrow -->
  <path d="M48 24 L56 24 L56 16" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
